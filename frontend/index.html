<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="color-scheme" content="dark" />

    <!-- Primary SEO Meta Tags -->
    <title>Ashen Path — Chronicles of Ash | Gamified RPG Productivity</title>
    <meta name="title" content="Ashen Path — Chronicles of Ash | Gamified RPG Productivity" />
    <meta
      name="description"
      content="Turn daily discipline, habits, and tasks into an epic RPG conquest. Level up your stats, slay multi-tier World Bosses, equip pixel artifacts, and master life with Ashen Path."
    />
    <meta
      name="keywords"
      content="life rpg, gamified productivity, habit tracker rpg, gamify life, quest tracker, boss raids, pixel hero, productivity app, self improvement rpg"
    />
    <meta name="author" content="Ayush Jagnani" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ashen Path — Chronicles of Ash" />
    <meta property="og:title" content="Ashen Path — Turn Real Habits Into RPG Glory" />
    <meta
      property="og:description"
      content="Conquer daily tasks, level up 6 attributes, equip live pixel gear, and slay Abyss World Bosses with your real productivity."
    />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ashen Path — Chronicles of Ash" />
    <meta
      name="twitter:description"
      content="Gamified real-world productivity engine. Slay procrastination and forge your legend."
    />
    <meta name="twitter:image" content="/favicon.svg" />

    <!-- Performance & Font Preconnections -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=MedievalSharp&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=MedievalSharp&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Ashen Path — Chronicles of Ash",
        "url": "https://ashenpath.app",
        "description": "A gamified productivity and habit-building RPG application where real-world task completions level up your hero character and defeat world bosses.",
        "applicationCategory": "ProductivityApplication, GameApplication",
        "operatingSystem": "All modern web browsers",
        "author": {
          "@type": "Person",
          "name": "Ayush Jagnani"
        },
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Gamified quest system with daily reminders and tags",
          "Real-time character attribute progression (Strength, Intelligence, Agility, Endurance, Focus, Charisma)",
          "Abyss Boss Raid engine powered by completed tasks",
          "Pixel art gear & live sprite equipment system",
          "Ancient Codex guides and lore",
          "Dark medieval fantasy aesthetic"
        ]
      }
    </script>
  </head>
  <body class="bg-[#0a0908] text-[#ede5d8] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
